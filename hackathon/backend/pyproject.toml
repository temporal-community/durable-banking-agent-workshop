[project]
name = "banking-hackathon-backend"
version = "0.1.0"
description = "Plain FastAPI banking backend with an inline fraud check, no Temporal"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "openai-agents>=0.22",
    "pydantic>=2.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
